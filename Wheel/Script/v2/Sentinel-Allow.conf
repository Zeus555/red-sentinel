# Sentinel v2 - Lista blanca de acciones (config, no codigo).
# Formato:  accion|tipo|os|plantilla
#   accion   : nombre validado con ^[a-z][a-z0-9_-]{0,32}$
#   tipo     : none = sin parametro | num = parametro entero obligatorio
#   os       : nix (Termux/Ubuntu/Raspberry/Tiny) | win (Windows)
#   plantilla: comando FIJO. {p}=parametro, {p1}=parametro+1. Ningun otro
#              byte del cliente entra jamas a la linea de comando.
# Anadir una accion = anadir dos lineas (nix + win). No se toca el .awk.

whoami|none|nix|whoami
whoami|none|win|whoami
hostname|none|nix|hostname
hostname|none|win|hostname
uptime|none|nix|uptime
uptime|none|win|net statistics workstation
# 'sleep' existe para demostrar paralelismo real sobre un solo puerto.
sleep|num|nix|sleep {p}; echo slept {p}s
sleep|num|win|ping -n {p1} 127.0.0.1 > NUL & echo slept {p}s
# addprice/addproducts: parametro tipo IP (validado por octetos). Reemplazan los
# endpoints POST /addprice y /addproducts del v1 (que inyectaban IP en system()).
addprice|ip|nix|cd '{run}' && ./ADD_Price_UP {p}
addprice|ip|win|cd /d "{run}" && ADD_Price_UP {p}
addproducts|ip|nix|cd '{run}' && ./ADD_Products_UP {p}
addproducts|ip|win|cd /d "{run}" && ADD_Products_UP {p}
# Asegurar sshd. Existe porque un nodo puede perder SSH y quedarse inalcanzable
# (paso en sentinel019 el 2026-08-14): el agente es entonces la unica puerta que
# queda. No recibe parametros, asi que no amplia la superficie de ataque.
# OJO: NO reinicia ni mata nada. En estos nodos sshd NO lo supervisa runit
# (su servicio tiene fichero down y lo arranca el script de arranque), asi
# que un "sv restart" o un pkill se cargaria el sshd que SI funciona.
# Solo arranca si no hay ninguno: es idempotente y no puede dejar fuera a nadie.
# CUIDADO: NINGUNA plantilla puede contener el caracter "|". LoadAllow() hace
# split(linea, f, "|") y se queda con f[4], asi que un "||" TRUNCA el comando en
# silencio. Paso de verdad: esta accion llevaba un "|| { sshd; }" y por eso NUNCA
# arrancaba sshd, pese a estar documentada como accion de rescate. Usar if/fi y ";".
restart-sshd|none|nix|timeout 25 sh -c 'G=/data/data/com.termux/files/usr/bin/sshd-guard; if [ -x "$G" ]; then exec "$G"; fi; sshd </dev/null >/dev/null 2>&1; echo "sshd arrancado (sin guard)"' </dev/null 2>&1
restart-sshd|none|win|echo no-aplica
